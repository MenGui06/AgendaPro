<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body class="center">
<form class="modal" th:action="@{/appointments}" th:object="${appointment}" method="post">
  <h2 th:text="*{id} == null ? 'Novo agendamento' : 'Editar agendamento'">Novo agendamento</h2>

  <input type="hidden" th:field="*{id}">
  <input type="hidden" name="view" th:value="${view}">

  <label>Título
    <input type="text" th:field="*{title}" autofocus>
    <span class="error" th:errors="*{title}"></span>
  </label>

  <div class="row">
    <label>Início
      <input type="datetime-local" th:field="*{startTime}">
      <span class="error" th:errors="*{startTime}"></span>
    </label>
    <label>Fim
      <input type="datetime-local" th:field="*{endTime}">
      <span class="error" th:errors="*{endTime}"></span>
    </label>
  </div>

  <label>Descrição
    <textarea rows="3" th:field="*{description}"></textarea>
  </label>

  <div class="actions">
    <button type="submit" class="danger" th:if="*{id != null}"
            th:formaction="@{/appointments/{id}/delete(id=*{id})}"
            formnovalidate onclick="return confirm('Excluir este agendamento?')">Excluir</button>
    <span class="spacer"></span>
    <a class="btn" th:href="@{/(view=${view},date=${back})}">Cancelar</a>
    <button type="submit" class="primary">Salvar</button>
  </div>
</form>
</body>
</html>
